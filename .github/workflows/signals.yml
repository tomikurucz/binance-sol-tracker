name: Pivot signals -> push

on:
  schedule:
    # Kicsit az orafordulo ELE tervezunk (":58"), majd a job belul megvarja a
    # kovetkezo egesz orat +3 mp-et. Igy a GitHub cron kesese (gyakran 1-10 perc)
    # sem rontja el az idzitest, es az 1h gyertya biztosan lezart allapotban
    # ertekelodik. A cron mindig UTC-ben ertendo.
    - cron: "58 * * * *"
  workflow_dispatch:   # kezi inditas a GitHub felulten
    inputs:
      test:
        description: "Csak teszt ertesites kuldese (nincs jelzes-ellenorzes)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pivot-signals
  cancel-in-progress: false

jobs:
  check-signals:
    runs-on: ubuntu-latest
    steps:
      - name: Repo checkout
        uses: actions/checkout@v4

      - name: Python beallitas
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fuggosegek telepitese
        run: pip install -r requirements.txt

      - name: Korabbi allapot visszaallitasa
        uses: actions/cache/restore@v4
        with:
          path: last_signal.json
          key: last-signal-${{ github.run_id }}
          restore-keys: |
            last-signal-

      - name: Ertesitesi beallitasok ellenorzese (ertek nelkul)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
        run: |
          python - <<'PY'
          import os

          names = ["NTFY_TOPIC", "TELEGRAM_BOT_TOKEN", "TELEGRAM_CHAT_ID",
                   "DISCORD_WEBHOOK_URL", "PUSHOVER_TOKEN", "PUSHOVER_USER"]
          any_set = False
          for name in names:
              value = os.environ.get(name, "")
              if value:
                  any_set = True
              state = f"beallitva (hossz={len(value)})" if value else "URES"
              print(f"{name:22s} {state}")
          print("Van beallitott csatorna:", any_set)
          PY

      - name: Teszt ertesites
        if: ${{ inputs.test == true }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
        run: python pivot_signals.py --test-notify

      - name: Varakozas a kovetkezo egesz orara
        if: ${{ inputs.test != true }}
        run: |
          python - <<'PY'
          import datetime as dt
          import time

          now = dt.datetime.now(dt.timezone.utc)
          # A kovetkezo orafordulo + 3 mp (ennyi kell a gyertya lezarasahoz).
          target = (now.replace(minute=0, second=0, microsecond=0)
                    + dt.timedelta(hours=1, seconds=3))
          delay = (target - now).total_seconds()
          if 0 < delay < 600:
              print(f"Varakozas {delay:.0f} mp-et a(z) {target:%H:%M:%S} UTC oraig...")
              time.sleep(delay)
          else:
              print("Nincs varakozas (az orafordulo mar elmult vagy tul nagy a keses).")
          PY

      - name: Jelzesek ellenorzese es ertesites
        if: ${{ inputs.test != true }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
        run: python pivot_signals.py --limit 1000 --closed-only --notify-once

      - name: Allapot fajl biztositasa
        if: ${{ always() && inputs.test != true }}
        run: test -f last_signal.json || echo '{}' > last_signal.json

      - name: Allapot mentese
        if: ${{ always() && inputs.test != true }}
        uses: actions/cache/save@v4
        with:
          path: last_signal.json
          key: last-signal-${{ github.run_id }}
